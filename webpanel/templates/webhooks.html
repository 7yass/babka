{% extends 'base.html' %}
{% block body %}
<h1>Post via webhook</h1>
<form method="post" action="/webhooks">
  <label>Webhook URL<input name="url" placeholder="https://discord.com/api/webhooks/..."></label>
  <label>Username (optional)<input name="username" placeholder="Babka Danka"></label>
  <label>Message<textarea name="content" rows="6"></textarea></label>
  <button>Send</button>
</form>
<p class="hint">Make webhooks in Discord: channel settings → Integrations → Webhooks. Then attach verify with <b>/rules attach</b> in Discord.</p>
{% endblock %}
